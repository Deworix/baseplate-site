<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <pattern id="studs" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.2" fill="#253249"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#8797b5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="1500" fill="#080b12"/>
  <rect x="850" y="100" width="290" height="1240" fill="url(#studs)"/>
  <g fill="none" stroke="#87a5ff" stroke-width="2.5"><rect x="72" y="68" width="44" height="44" rx="10"/></g>
  <g fill="#87a5ff"><circle cx="85" cy="81" r="3.5"/><circle cx="103" cy="81" r="3.5"/><circle cx="85" cy="99" r="3.5"/><circle cx="103" cy="99" r="3.5"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="132" y="100" font-size="33" font-weight="700" fill="#f3f6ff">Baseplate</text>
    <text x="1128" y="100" text-anchor="end" font-size="21" letter-spacing="2" fill="#9dacc5">STUDIO FIELD NOTE / 001</text>
    <text x="72" y="208" font-size="23" letter-spacing="3" fill="#87a5ff">TEST THE BACKWARD PATH.</text>
    <text x="67" y="321" font-size="102" letter-spacing="-5" font-weight="900" fill="#f3f6ff">3 → 1 → reset.</text>
    <text x="72" y="380" font-size="33" fill="#aab6cc">Highest checkpoint reached: still 3.</text>
    <path d="M72 433H1128" stroke="#263149"/>
    <text x="72" y="491" font-size="22" letter-spacing="2.5" fill="#aab6cc">BEFORE / LAST TOUCH WINS</text>
    <g font-size="54" font-weight="800" text-anchor="middle">
      <circle cx="150" cy="595" r="62" fill="#172238" stroke="#87a5ff" stroke-width="2"/><text x="150" y="614" fill="#f3f6ff">3</text>
      <path d="M230 595H456" stroke="#8797b5" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="550" cy="595" r="62" fill="#172238" stroke="#87a5ff" stroke-width="2"/><text x="550" y="614" fill="#f3f6ff">1</text>
      <path d="M630 595H856" stroke="#8797b5" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="950" cy="595" r="62" fill="#35191e" stroke="#ff716b" stroke-width="3"/><text x="950" y="614" fill="#ff716b">1</text>
    </g>
    <g font-size="21" fill="#aab6cc" text-anchor="middle"><text x="150" y="699">REACH 3</text><text x="550" y="699">TOUCH 1</text><text x="950" y="699">RESPAWN AT 1</text></g>
    <text x="72" y="765" font-size="34" font-weight="700" fill="#ff716b">FAIL</text><text x="192" y="765" font-size="28" fill="#c0cadc">44.03 studs from the checkpoint to keep.</text>
    <path d="M72 818H1128" stroke="#263149"/>
    <text x="72" y="877" font-size="22" letter-spacing="2.5" fill="#aab6cc">AFTER / MANUAL GUARD, SAME REPLAY</text>
    <g font-size="54" font-weight="800" text-anchor="middle">
      <circle cx="150" cy="980" r="62" fill="#172238" stroke="#87a5ff" stroke-width="2"/><text x="150" y="999" fill="#f3f6ff">3</text>
      <path d="M230 980H456" stroke="#8797b5" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="550" cy="980" r="62" fill="#172238" stroke="#87a5ff" stroke-width="2"/><text x="550" y="999" fill="#f3f6ff">1</text>
      <path d="M630 980H856" stroke="#8797b5" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="950" cy="980" r="62" fill="#12342c" stroke="#70e5b3" stroke-width="3"/><text x="950" y="999" fill="#70e5b3">3</text>
    </g>
    <g font-size="21" fill="#aab6cc" text-anchor="middle"><text x="150" y="1084">REACH 3</text><text x="550" y="1084">IGNORE EARLIER 1</text><text x="950" y="1084">RESPAWN AT 3</text></g>
    <text x="72" y="1150" font-size="34" font-weight="700" fill="#70e5b3">PASS</text><text x="192" y="1150" font-size="28" fill="#c0cadc">4.71 studs · within this fixture’s 8-stud tolerance.</text>
    <path d="M72 1200H1128" stroke="#263149"/>
    <text x="72" y="1264" font-size="29" font-weight="700" fill="#f3f6ff">Run the same actions. Check the actual respawn.</text>
    <text x="72" y="1313" font-size="24" fill="#9dacc5">Own local demo · Baseplate 0.23 · session-only progress</text>
    <text x="72" y="1355" font-size="24" fill="#9dacc5">Checks this behavior. Not persistent saves or whole-game correctness.</text>
    <text x="72" y="1440" font-size="26" fill="#87a5ff">baseplatedev.com</text><text x="1128" y="1440" text-anchor="end" font-size="23" fill="#9dacc5">CHECKLIST + GUARD IN POST</text>
  </g>
</svg>
